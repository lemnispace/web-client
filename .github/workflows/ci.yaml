name: Integration

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LEMNISPACE_PRODUCTS_API_TOKEN: ${{ secrets.LEMNISPACE_PRODUCTS_API_TOKEN }}
      LEMNISPACE_STORE_DOMAIN: ${{ vars.LEMNISPACE_STORE_DOMAIN }}
      LEMNISPACE_HOST_NAME: ${{ vars.LEMNISPACE_STORE_DOMAIN }}
      TEXT_MOSAIC_API_URL: ${{ secrets.TEXT_MOSAIC_API_URL }}
      LEMNISPACE_MOCKUP_GEN_KEY: ${{ secrets.LEMNISPACE_MOCKUP_GEN_KEY }}
      LEMNISPACE_MOCKUP_GEN_API_URL: ${{ vars.LEMNISPACE_MOCKUP_GEN_API_URL }}
      LEMNISPACE_PRODUCTS_ADMIN_API_TOKEN: ${{ secrets.LEMNISPACE_PRODUCTS_ADMIN_API_TOKEN }}
      LEMNISPACE_PRODUCTS_API_KEY: ${{ secrets.LEMNISPACE_PRODUCTS_API_KEY }}
      LEMNISPACE_PRODUCTS_API_SECRET_KEY: ${{ secrets.LEMNISPACE_PRODUCTS_API_SECRET_KEY }}
      LEMNISPACE_SHOP_NAME: ${{ vars.LEMNISPACE_SHOP_NAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          # See here for caching with `yarn` https://github.com/actions/cache/blob/main/examples.md#node---yarn or you can leverage caching with actions/setup-node https://github.com/actions/setup-node
          path: |
            ~/.npm
            ${{ github.workspace }}/.next/cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install dependencies
        # fixes issues with postcss.config.js when node env is manually set to production https://community.render.com/t/nextjs-13-build-failing-error-cannot-find-module-tailwindcss/14503
        run: |
          npm ci --include=dev

      # fixes type-check errors https://github.com/vercel/next.js/issues/53959#issuecomment-1741062235
      - name: build
        run: |
          npm run build

      - name: typecheck
        run: |
          npm run type-check

      - name: lint
        run: |
          npm run lint

      - name: Test
        run: |
          npm run test:ci

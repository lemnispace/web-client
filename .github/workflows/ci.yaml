name: Integration

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LEMNISPACE_PRODUCTS_API_TOKEN: ${{ secrets.LEMNISPACE_PRODUCTS_API_TOKEN }}
      LEMNISPACE_STORE_DOMAIN: ${{ secrets.LEMNISPACE_STORE_DOMAIN }}
      TEXT_MOSAIC_API_URL: ${{ secrets.TEXT_MOSAIC_API_URL }}
      LEMNISPACE_MOCKUP_GEN_KEY: ${{ secrets.LEMNISPACE_MOCKUP_GEN_KEY }}
      LEMNISPACE_MOCKUP_GEN_API_URL: ${{ secrets.LEMNISPACE_MOCKUP_GEN_API_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install dependencies
        run: |
          npm ci
      # fixes type-check errors https://github.com/vercel/next.js/issues/53959#issuecomment-1741062235
      - name: build
        run: |
          npm run build

      - name: typecheck
        run: |
          npm run type-check

      - name: lint
        run: |
          npm run lint

      - name: Test
        run: |
          npm run test:ci

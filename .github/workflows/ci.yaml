name: Integration

on:
  pull_request:
  push:
   branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install dependencies
        run: |
          npm ci

      - name: typecheck
        run: |
          npm run type-check

      - name: lint
        run: |
          npm run lint

      - name: Test
        run: |
          npm test
